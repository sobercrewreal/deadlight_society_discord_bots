services:
  ghostwrite:
    build:
      context: .
      dockerfile: bots/ghostwrite/Dockerfile
    container_name: ghostwrite-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bots/ghostwrite/data:/app/data

  haunt:
    build:
      context: .
      dockerfile: bots/haunt/Dockerfile
    container_name: haunt-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bots/haunt/data:/app/data
